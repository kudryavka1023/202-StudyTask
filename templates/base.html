<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}StudyTask{% endblock %} · StudyTask</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <header class="site-header">
    <div class="container header-inner">
      <a class="brand" href="{{ url_for('index') }}">
        StudyTask
        <span>个人学习任务管理</span>
      </a>
      <nav class="main-nav" aria-label="主导航">
        <a href="{{ url_for('index') }}">任务列表</a>
        <a class="button button-primary" href="{{ url_for('new_task') }}">新建任务</a>
      </nav>
    </div>
  </header>

  <main class="container">
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}
        <div class="flash-list">
          {% for category, message in messages %}
            <div class="flash flash-{{ category }}" role="status">{{ message }}</div>
          {% endfor %}
        </div>
      {% endif %}
    {% endwith %}

    {% block content %}{% endblock %}
  </main>

  <footer class="site-footer">
    <div class="container">StudyTask · 单用户本地学习任务管理</div>
  </footer>
</body>
</html>
